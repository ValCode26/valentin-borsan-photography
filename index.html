<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentin Borsan | Portraits</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 text-gray-900">

  <header class="p-6 text-center bg-white shadow">
    <h1 class="text-4xl font-bold">Valentin Borsan</h1>
    <p class="text-lg text-gray-600">Visual storytelling through portraits</p>
  </header>

  <main class="max-w-5xl mx-auto p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    <img src="images/portrait1.jpg" alt="Portrait 1" class="gallery-img rounded-xl shadow cursor-pointer" />
    <img src="images/portrait2.jpg" alt="Portrait 2" class="gallery-img rounded-xl shadow cursor-pointer" />
    <img src="images/portrait3.jpg" alt="Portrait 3" class="gallery-img rounded-xl shadow cursor-pointer" />
  </main>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
    <img id="lightbox-img" src="" class="max-h-[90%] max-w-[90%] rounded shadow-2xl" />
  </div>

  <footer class="text-center p-4 mt-12 text-sm text-gray-500">
    © 2025 Valentin Borsan. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
